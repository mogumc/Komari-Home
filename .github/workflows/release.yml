name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Get version & hash
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          HASH=$(git rev-parse --short=7 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          zip -r "komari-home-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.hash }}.zip" dist komari-theme.json preview.png

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: komari-home-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.hash }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
